name: ci

on:
  # Every branch, every push: an edit is only checked once it is pushed.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch cancels the run it superseded, so quick
  # successive edits never queue minutes of stale builds.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # windows-2022 = Server 2022 image, ships MSVC + SDK, matches Win10 ABI.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --release -- -D warnings

      - name: test
        run: cargo test --release

      - name: selftest
        # `cargo run` builds the binary as well: `cargo test` only produces
        # test executables, so target\release\appsweep.exe does not exist yet.
        run: cargo run --release -- --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: AppSweep
          path: |
            target/release/appsweep.exe
            release/README.txt
