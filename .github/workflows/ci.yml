name: ci

on:
  # Every branch, every push: an edit is only checked once it is pushed.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch cancels the run it superseded, so quick
  # successive edits never queue minutes of stale builds.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    # windows-2022 = Server 2022 image, ships MSVC + SDK, matches Win10 ABI.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        # --locked: a Dependabot PR must ship a matching Cargo.lock, otherwise
        # CI resolves silently and the committed lock can rot.
        run: cargo clippy --release --locked -- -D warnings

      - name: test
        run: cargo test --release --locked

      - name: selftest
        # `cargo run` builds the binary as well: `cargo test` only produces
        # test executables, so target\release\appsweep.exe does not exist yet.
        run: cargo run --release --locked -- --selftest

      - uses: actions/upload-artifact@v7
        with:
          name: AppSweep
          path: |
            target/release/appsweep.exe
            release/README.txt

  # Runs on every PR, so a Dependabot bump is screened for known high/critical
  # vulnerabilities before the Windows build above is even finished. Public
  # repo only: the dependency-graph diff API is free here.
  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
