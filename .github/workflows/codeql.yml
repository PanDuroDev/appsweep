name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: most advisories are published after the code was written.
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          # Every target is Rust now (the C++ helper is gone), and `none`
          # parses it without a Windows build. build.rs only embeds the icon.
          languages: rust
          build-mode: none

      - uses: github/codeql-action/analyze@v4
